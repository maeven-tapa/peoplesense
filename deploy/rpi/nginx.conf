# Local LAN commissioning with DJANGO_DEBUG=1. Replace server_name with the
# actual Pi hostname/IP. Add TLS before setting DJANGO_DEBUG=0.
server {
    listen 80;
    server_name peoplesense.local 10.0.0.1;
    access_log /opt/peoplesense/logs/nginx-access.log;
    error_log /opt/peoplesense/logs/nginx-error.log;
    location /static/ {
        alias /opt/peoplesense/staticfiles/;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
